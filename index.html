<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Todoliste" />
<meta name="theme-color" content="#2563eb" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Ma Todoliste</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #8b949e;
    --line: #e8e8e4;
    --accent: #2563eb;
    --devoir: #f59e0b;
    --mail: #10b981;
    --slack: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    padding-top: calc(24px + env(safe-area-inset-top));
    -webkit-tap-highlight-color: transparent;
  }
  .app { width: 100%; max-width: 560px; }
  input, select, button { font-size: 16px; }
  button { -webkit-appearance: none; appearance: none; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  form input[type="text"] { flex: 1 1 100%; }
  input[type="datetime-local"] {
    padding: 12px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    font-size: 15px;
    color: var(--text);
    outline: none;
    flex: 1 1 45%;
  }
  input[type="datetime-local"]:focus { border-color: var(--accent); }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card);
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  select {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    font-size: 15px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  button.add {
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button.add:hover { opacity: .88; }

  .filters { display: flex; gap: 6px; margin: 16px 0 8px; flex-wrap: wrap; }
  .filters button {
    padding: 6px 12px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .filters button.active { background: var(--text); color: #fff; }

  ul { list-style: none; margin-top: 8px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    animation: in .18s ease;
  }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .task { flex: 1; }
  .task .label { font-size: 15px; }
  li.done .task .label { text-decoration: line-through; color: var(--muted); }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: .3px;
  }
  .tag.devoir { background: #fef3c7; color: #92400e; }
  .tag.mail { background: #d1fae5; color: #065f46; }
  .tag.slack { background: #f3e8ff; color: #6b21a8; }
  .delete {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .delete:hover { color: #dc2626; background: #fee2e2; }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .footer button {
    border: none; background: none; color: var(--accent);
    font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .notif { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .notif button {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .notif span { color: var(--muted); font-size: 13px; }
  .install-hint { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="app">
  <h1>Ma Todoliste</h1>
  <p class="subtitle">Ce que tu dois faire — devoirs, mails, Slack.</p>

  <form id="form">
    <input type="text" id="input" placeholder="Ex : Répondre au mail de M. Dupont…" autocomplete="off" />
    <input type="datetime-local" id="due" title="Rappel (optionnel)" />
    <select id="category">
      <option value="devoir">Devoir</option>
      <option value="mail">Mail</option>
      <option value="slack">Slack</option>
    </select>
    <button class="add" type="submit">Ajouter</button>
  </form>

  <div class="filters" id="filters">
    <button data-filter="all" class="active">Tout</button>
    <button data-filter="devoir">Devoir</button>
    <button data-filter="mail">Mail</button>
    <button data-filter="slack">Slack</button>
    <button data-filter="todo">À faire</button>
    <button data-filter="done">Terminé</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>Rien ici. Ajoute une tâche ! ✨</div>

  <div class="footer">
    <span id="count"></span>
    <button id="clearDone">Effacer les terminées</button>
  </div>

  <div class="notif">
    <button id="notifBtn">🔔 Activer les rappels</button>
    <span id="notifState"></span>
  </div>

  <p class="install-hint">📱 iPhone : ouvre cette page dans Safari, puis <b>Partager → Sur l'écran d'accueil</b> pour installer l'app.</p>
</div>

<script>
  const STORAGE_KEY = "todoliste.tasks";
  const CATS = ["devoir", "mail", "slack"];

  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { tasks = []; }
  let filter = "all";

  const $ = (id) => document.getElementById(id);
  const listEl = $("list"), emptyEl = $("empty"), countEl = $("count");

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function render() {
    const visible = tasks.filter(t =>
      filter === "all" ? true :
      filter === "todo" ? !t.done :
      filter === "done" ? t.done :
      t.category === filter
    );
    listEl.innerHTML = "";
    visible.forEach(t => {
      const li = document.createElement("li");
      if (t.done) li.classList.add("done");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });

      const div = document.createElement("div");
      div.className = "task";
      const span = document.createElement("span");
      span.className = "label";
      span.textContent = t.text;
      div.appendChild(span);

      const tag = document.createElement("span");
      tag.className = "tag " + t.category;
      tag.textContent = t.category;

      const del = document.createElement("button");
      del.className = "delete";
      del.title = "Supprimer";
      del.textContent = "✕";
      del.addEventListener("click", () => {
        tasks = tasks.filter(x => x !== t);
        save(); render();
      });

      li.append(cb, div, tag, del);
      listEl.appendChild(li);
    });
    emptyEl.hidden = visible.length > 0;
    const remaining = tasks.filter(t => !t.done).length;
    countEl.textContent = remaining === 0 ? "Tout est fait 🎉" : remaining + (remaining > 1 ? " tâches restantes" : " tâche restante");
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, category: $("category").value, due: $("due").value ? new Date($("due").value).getTime() : null, done: false });
    $("input").value = "";
    $("due").value = "";
    save(); render(); scheduleReminders();
  });

  $("filters").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-filter]");
    if (!btn) return;
    filter = btn.dataset.filter;
    document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });

  $("clearDone").addEventListener("click", () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  const notifBtn = $("notifBtn"), notifState = $("notifState");
  const timers = [];

  function notify(title, body) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.ready.then((reg) => reg.showNotification(title, { body, icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: title }));
    } else {
      new Notification(title, { body, icon: "icons/icon-192.png" });
    }
  }

  function scheduleReminders() {
    timers.forEach(clearTimeout);
    timers.length = 0;
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const now = Date.now();
    tasks.filter(t => !t.done && t.due).forEach(t => {
      const delay = t.due - now;
      if (delay > 0 && delay < 86400000) {
        timers.push(setTimeout(() => {
          notify("Rappel : " + t.text, "C'est l'heure de cette tâche !");
        }, delay));
      }
    });
  }

  function updateNotifUI() {
    if (!("Notification" in window)) {
      notifBtn.hidden = true;
      notifState.textContent = "Notifications non prises en charge.";
      return;
    }
    const granted = Notification.permission === "granted";
    notifBtn.textContent = granted ? "🔕 Rappels activés" : "🔔 Activer les rappels";
    notifBtn.disabled = granted;
    notifState.textContent = granted ? "Tu recevras un rappel à l'heure de chaque tâche (app ouverte)." : "Demande la permission pour être rappelé à l'heure des tâches.";
  }

  notifBtn.addEventListener("click", async () => {
    if ("Notification" in window && Notification.permission === "default") {
      await Notification.requestPermission();
    }
    updateNotifUI();
    scheduleReminders();
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => scheduleReminders());
  }

  updateNotifUI();
  scheduleReminders();
  render();
</script>
</body>
</html>
